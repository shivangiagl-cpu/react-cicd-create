name: Deploy Dist
on: [push,workflow_dispatch]
jobs: 
    test:
        runs-on: ubuntu-latest
        steps: 
           - name: "Get Code"
             uses: actions/checkout@v6
           - name: Install Node
             uses: actions/setup-node@v6
             with:
                node-version: 20
           - name: Install Dependencies
             run: npm ci #Clean install
           - name: Run Tests
             run: npm run test
            #  run: |
            #     echo "Cloning repo..."
            #     git clone https://github.com/${{toJson(github.repository)}}.git
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: "Get Code"
              uses: actions/checkout@v6
            - name: Install Node
              uses: actions/setup-node@v6
              with:
                node-version: 20
            - name: Install Dependencies
              run: npm ci
            - name: Build Project
              run: npm run build
            - name: Deploy
              run: echo "Deploy successful"

